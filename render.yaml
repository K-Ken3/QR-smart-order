services:
  - type: web
    name: smartserve-api
    runtime: node
    plan: free
    buildCommand: |
      npm install -g pnpm@9.15.0
      pnpm install
      pnpm --filter @smartserve/types build
      pnpm --filter @smartserve/backend build
      pnpm --filter @smartserve/backend exec prisma generate
      pnpm --filter @smartserve/backend exec prisma migrate deploy
    startCommand: pnpm --filter @smartserve/backend exec node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: QR_HMAC_ENCRYPTION_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://smartserve-qr.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://smartserve-qr.vercel.app,http://localhost:3000
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
