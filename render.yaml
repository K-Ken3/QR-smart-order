services:
  # ─────────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────────────────────────────
  - type: pgsql
    name: smartserve-db
    plan: free
    databaseName: smartserve
    ipAllowList: []

  # ─────────────────────────────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────────────────────────────
  - type: redis
    name: smartserve-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # ─────────────────────────────────────────────────────────────────────
  # Backend API (NestJS)
  # ─────────────────────────────────────────────────────────────────────
  - type: web
    name: smartserve-api
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: smartserve-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: smartserve-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: QR_HMAC_ENCRYPTION_KEY
        generateValue: true
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FLW_CURRENCY
        value: RWF
      - key: FLW_WEBHOOK_HASH
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
